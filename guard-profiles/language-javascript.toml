id = "language/javascript"
markers = ["package.json"]
allow_commands = [
  "npm install",
  "npm ci",
  "npm test",
  "npm run build",
  "npm run lint",
  "npm run typecheck",
  "pnpm install",
  "pnpm add",
  "pnpm test",
  "pnpm run build",
  "pnpm run lint",
  "pnpm run typecheck",
  "yarn install",
  "yarn add",
  "yarn test",
  "yarn run build",
  "yarn run lint",
  "yarn run typecheck",
  "bun install",
  "bun add",
  "bun test",
  "bun run build",
  "bun run lint",
  "bun run typecheck",
]
